<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egg Car Collision Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --shell: #fffaf0; --shell-2: #fff3dc;
    --yolk: #ffc93c; --yolk-deep: #f4a300;
    --straw: #e9c98b; --nest: #a8743f; --nest-dark: #6e4a26;
    --ink: #3b2a1a; --ink-soft: #7a634b;
    --done: #7cc576; --done-deep: #3f8f3a;
    --warn: #e5484d; --warn-deep: #b4232a;
    --card: #ffffff; --line: #f0e2c6;
    --shadow: 0 4px 14px rgba(110, 74, 38, .10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(circle at 10% 0%, #fff6e0 0, transparent 40%),
                radial-gradient(circle at 90% 10%, #fdeccc 0, transparent 35%), var(--shell);
    min-height: 100vh;
  }
  .wrap { padding: 10px 16px 12px; }

  /* ---------- Compact header ---------- */
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .logo { width: 36px; height: 44px; flex: none; animation: wobble 4s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wobble { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(-7deg); } 90% { transform: rotate(6deg); } 95% { transform: rotate(-3deg); } }
  h1 { font-family: "Baloo 2", cursive; font-weight: 800; font-size: 1.7rem; line-height: 1; margin: 0; color: var(--nest-dark); white-space: nowrap; }
  h1 span { color: var(--yolk-deep); }
  .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .tools input, .tools select {
    font: inherit; font-weight: 600; font-size: .9rem; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 0;
  }
  .tools input { width: 200px; }
  .tools input:focus, .tools select:focus { outline: none; border-color: var(--yolk); }
  .updated { font-size: .78rem; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
  .tools button {
    font: inherit; font-weight: 800; font-size: .85rem; cursor: pointer;
    background: var(--yolk); color: var(--ink); border: none; border-radius: 999px;
    padding: 6px 14px; box-shadow: 0 3px 0 var(--yolk-deep);
  }
  .tools button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--yolk-deep); }

  /* ---------- Board: group bubbles in balanced columns.
     Everything inside is sized in em, so the script can shrink or grow
     the whole board (font-size) until the class fits on one screen. ---------- */
  .board { column-gap: .8em; font-size: 16px; }
  .group {
    break-inside: avoid; display: inline-block; width: 100%;
    background: var(--card); border: 2px solid var(--line); border-radius: 1em;
    box-shadow: var(--shadow); padding: .4em .8em .3em; margin-bottom: .7em;
    animation: pop .4s ease both;
  }
  .group.all-hatched { border-color: var(--yolk); background: linear-gradient(180deg, #fffbe8, #fff); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .ghead, .stu { display: grid; grid-template-columns: 6.8em 1fr; align-items: center; }
  .ghead { min-height: 1.6em; padding: .1em 0; border-bottom: 2px dotted var(--line); margin-bottom: .1em; }
  .ghead b { font-family: "Baloo 2", cursive; font-weight: 800; font-size: 1.05em; line-height: 1.1; color: var(--nest-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-right: .3em; }
  .ghead b small { display: block; font-family: "Nunito"; font-weight: 700; font-size: .68em; line-height: 1.2; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; }
  .labels { position: relative; align-self: stretch; min-height: 1.4em; margin: 0 1em; }
  .labels span {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    font-family: "Baloo 2", cursive; font-weight: 800; font-size: .52em; letter-spacing: .02em; color: var(--nest);
  }

  .stu { height: 3.05em; }
  .name { font-weight: 800; font-size: .92em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: .3em; }
  .stu.hatched .name::after { content: " 🐣"; }
  .stu.flag .name { color: var(--warn-deep); }

  .track { position: relative; height: 100%; margin: 0 1em; }
  .rail, .fill { position: absolute; top: 50%; height: .32em; transform: translateY(-50%); border-radius: 99px; }
  .rail-end {
    position: absolute; top: 50%; left: 80%; right: 0; transform: translateY(-50%);
    border-top: .14em dashed var(--straw); opacity: .8;
  }
  .sign {
    position: absolute; top: calc(50% + 1.35em); transform: translateX(-50%);
    white-space: nowrap; line-height: 1.2;
    font-size: .52em; font-weight: 800; color: var(--nest-dark);
    background: var(--yolk); border-radius: 99px; padding: .15em .65em .2em;
    box-shadow: 0 .15em 0 var(--yolk-deep); z-index: 3;
    animation: signPop .5s .6s cubic-bezier(.5,1.8,.5,1) both;
  }
  .sign::after {
    content: ""; position: absolute; left: 50%; top: -.4em; transform: translateX(-50%);
    border: .4em solid transparent; border-bottom-color: var(--yolk); border-top: 0;
  }
  .sign i { font-style: normal; margin-right: .2em; }
  @keyframes signPop { from { opacity: 0; transform: translateX(-50%) scale(.4); } }
  .rail { left: 0; right: 20%; background: repeating-linear-gradient(90deg, var(--straw) 0 .5em, #f3dcae .5em .9em); }
  .fill { left: 0; background: linear-gradient(90deg, var(--yolk), var(--yolk-deep)); transition: width 1s cubic-bezier(.5,1.6,.4,1); }
  .nest {
    position: absolute; top: 50%; width: 1.2em; height: 1.2em; transform: translate(-50%, -50%);
    border-radius: 50%; background: #fff; border: .14em solid var(--straw);
    display: grid; place-items: center; color: var(--straw); font-weight: 800;
  }
  .nest span { font-size: .55em; }
  .nest.done { background: var(--done); border-color: var(--done-deep); color: #fff; }
  .nest.done::after { content: "✓"; font-size: .7em; }
  .nest.skipped { background: var(--warn); border-color: var(--warn-deep); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
  .nest.skipped::after { content: "!"; font-size: .8em; font-weight: 900; }
  .nest.done span, .nest.skipped span { display: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.45); } 50% { box-shadow: 0 0 0 .35em rgba(229,72,77,0); } }
  .egg {
    position: absolute; top: 50%; width: 1.45em; height: 1.8em; transform: translate(-50%, -82%);
    transition: left 1.1s cubic-bezier(.5,1.5,.45,1);
    filter: drop-shadow(0 .12em .1em rgba(110,74,38,.25)); z-index: 2; pointer-events: none;
  }
  .egg svg { width: 100%; height: 100%; display: block; }
  .egg.bounce { animation: hop 1.1s ease; }
  @keyframes hop { 0%,60%,100% { margin-top: 0; } 35% { margin-top: -.6em; } 75% { margin-top: -.2em; } }

  .msg {
    background: var(--card); border: 2px dashed var(--straw); border-radius: 18px;
    padding: 24px 20px; text-align: center; color: var(--ink-soft); font-weight: 600; font-size: 16px;
  }
  .msg h2 { font-family: "Baloo 2", cursive; color: var(--nest-dark); margin: 0 0 6px; }
  .msg code { background: var(--shell-2); padding: 2px 6px; border-radius: 6px; }

  @media (max-width: 700px) {
    .tools { margin-left: 0; width: 100%; }
    .tools input { flex: 1 1 140px; width: auto; }
    .ghead, .stu { grid-template-columns: 5.4em 1fr; }
    .labels span { font-size: .46em; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 70 84" aria-hidden="true">
      <ellipse cx="35" cy="78" rx="26" ry="5" fill="#e9c98b"/>
      <path d="M35 4C19 4 7 30 7 50c0 17 12 28 28 28s28-11 28-28C63 30 51 4 35 4z" fill="#fff" stroke="#e9c98b" stroke-width="3"/>
      <circle cx="26" cy="46" r="3.2" fill="#3b2a1a"/><circle cx="44" cy="46" r="3.2" fill="#3b2a1a"/>
      <path d="M29 56q6 5 12 0" stroke="#3b2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="54" r="3.5" fill="#ffb3a7" opacity=".7"/><circle cx="50" cy="54" r="3.5" fill="#ffb3a7" opacity=".7"/>
    </svg>
    <h1>Egg Car <span>Collision Lab</span></h1>
    <div class="tools">
      <input id="search" type="search" placeholder="🔍 Find a student…" aria-label="Search students">
      <select id="teacherFilter" aria-label="Filter by teacher"><option value="">All teachers</option></select>
      <span class="updated" id="updatedText">Loading…</span>
      <button id="refreshBtn" type="button">↻ Refresh</button>
    </div>
  </header>
  <main class="board" id="board"><div class="msg">Gathering the eggs…</div></main>
</div>

<script>
/* =========================================================
   SETTINGS
   ========================================================= */
const SHEET_ID   = "1kPS2ggL5fbPn51m6TvhCfranGeJ9z_0xDW5pOVneqvI";
const SHEET_TAB  = "Form Responses 1";   // tab name at the bottom of the sheet
const REFRESH_SECONDS = 60;               // how often the board reloads

/* The five steps, matched to the sheet by the capitalised word in each column header. */
const STEPS = ["ASK", "EXPLORE", "MODEL", "EVALUATE", "EXPLAIN"];

/* =========================================================
   Data loading (Google Visualization endpoint — no API key needed;
   the sheet just has to be shared as "Anyone with the link can view")
   ========================================================= */
const baseUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&sheet=${encodeURIComponent(SHEET_TAB)}`;

function parseGviz(text) {
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  return JSON.parse(text.slice(start, end + 1));
}

async function loadViaFetch() {
  const res = await fetch(baseUrl + "&tqx=out:json&_=" + Date.now());
  if (!res.ok) throw new Error("HTTP " + res.status);
  return parseGviz(await res.text());
}

function loadViaJsonp() {
  return new Promise((resolve, reject) => {
    const cb = "eggCb" + Date.now();
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("script error")); };
    s.src = baseUrl + "&tqx=responseHandler:" + cb + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

async function loadSheet() {
  let data;
  try { data = await loadViaFetch(); }
  catch (e) { data = await loadViaJsonp(); }
  if (data.status === "error") throw new Error((data.errors && data.errors[0] && data.errors[0].detailed_message) || "Sheet error");
  const headers = data.table.cols.map(c => (c.label || "").trim());
  const rows = data.table.rows.map(r => (r.c || []).map(cell => {
    if (!cell) return "";
    if (cell.f != null) return String(cell.f);
    return cell.v == null ? "" : String(cell.v);
  }));
  return { headers, rows };
}

/* =========================================================
   Turn form responses into one record per student.
   The form has repeated sections (one per teacher), each starting
   with a "Name" column, followed by group + the five step columns.
   A student's step counts as done if ANY of their rows says Yes.
   ========================================================= */
function buildStudents({ headers, rows }) {
  let teacherCol = -1, timeCol = -1;
  const sections = [];
  let current = null;

  headers.forEach((h, i) => {
    const lower = h.toLowerCase();
    if (lower === "name" || lower === "student name" || lower === "your name") {
      current = { name: i, group: -1, steps: {} };
      sections.push(current);
      return;
    }
    if (!current) {
      if (lower.includes("teacher")) teacherCol = i;
      if (lower.includes("timestamp")) timeCol = i;
      return;
    }
    if (lower.includes("group")) { current.group = i; return; }
    STEPS.forEach(step => {
      if (new RegExp("\\b" + step + "\\b").test(h) && current.steps[step] == null) current.steps[step] = i;
    });
  });

  const isYes = v => /^\s*(y|yes|true|done|x|✓)\s*$/i.test(v || "");
  const students = new Map();

  rows.forEach(row => {
    const teacher = teacherCol >= 0 ? (row[teacherCol] || "").trim() : "";
    const time = timeCol >= 0 ? row[timeCol] : "";
    sections.forEach(sec => {
      const rawName = (row[sec.name] || "").trim().replace(/\s+/g, " ");
      if (!rawName) return;
      const key = teacher.toLowerCase() + "|" + rawName.toLowerCase();
      if (!students.has(key)) {
        students.set(key, { name: rawName, teacher, group: "", done: {}, last: "" });
      }
      const s = students.get(key);
      const grp = sec.group >= 0 ? (row[sec.group] || "").trim() : "";
      if (grp) s.group = grp.replace(/\.0$/, "");
      STEPS.forEach(step => {
        const col = sec.steps[step];
        if (col != null && isYes(row[col])) s.done[step] = true;
      });
      if (time) s.last = time;
    });
  });

  return [...students.values()].map(s => {
    const doneCount = STEPS.filter(st => s.done[st]).length;
    let furthest = -1;
    STEPS.forEach((st, i) => { if (s.done[st]) furthest = i; });
    return { ...s, doneCount, furthest };
  });
}

/* =========================================================
   Rendering
   ========================================================= */
const board = document.getElementById("board");
const searchEl = document.getElementById("search");
const teacherEl = document.getElementById("teacherFilter");
let allStudents = [];
let previousPositions = new Map();

function eggSvg(hatched) {
  if (hatched) {
    return `<svg viewBox="0 0 46 58" aria-hidden="true">
      <circle cx="23" cy="24" r="14" fill="#ffd84a" stroke="#f4a300" stroke-width="2"/>
      <path d="M19 9q4-6 6 0" stroke="#f4a300" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="18" cy="22" r="2.4" fill="#3b2a1a"/><circle cx="28" cy="22" r="2.4" fill="#3b2a1a"/>
      <path d="M21 27l2 3 2-3z" fill="#f47c20"/>
      <path d="M5 34l6 4 6-5 6 5 6-5 6 5 6-4c0 12-8 21-18 21S5 46 5 34z" fill="#fff" stroke="#e9c98b" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 46 58" aria-hidden="true">
    <path d="M23 3C12 3 4 21 4 35c0 12 8 20 19 20s19-8 19-20C42 21 34 3 23 3z" fill="#fff" stroke="#e9c98b" stroke-width="2.5"/>
    <ellipse cx="15" cy="20" rx="3" ry="6" fill="#fff6e0" transform="rotate(20 15 20)"/>
    <circle cx="17" cy="32" r="2.4" fill="#3b2a1a"/><circle cx="29" cy="32" r="2.4" fill="#3b2a1a"/>
    <path d="M19 39q4 3.5 8 0" stroke="#3b2a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fillFilters() {
  const keep = teacherEl.value;
  const teachers = [...new Set(allStudents.map(s => s.teacher).filter(Boolean))].sort();
  teacherEl.innerHTML = `<option value="">All teachers</option>` + teachers.map(t => `<option>${esc(t)}</option>`).join("");
  if (teachers.includes(keep)) teacherEl.value = keep;
  teacherEl.style.display = teachers.length > 1 ? "" : "none";
}

/* The five steps sit along the first 80% of each timeline; the last 20% is
   room for the "Keep testing" sign after EXPLAIN. */
const LINE_END = 80;
const stepPos = i => (i / (STEPS.length - 1)) * LINE_END;
/* The sign that appears on the line right after a student's furthest finished step */
const NEXT_SIGNS = [
  { icon: "✏️", text: "Design your car" },
  { icon: "🔧", text: "Build your car" },
  { icon: "🎥", text: "Upload a test video" },
  { icon: "📝", text: "Describe your collision" },
  { icon: "🔁", text: "Keep testing" },
];
const pctFor = s => stepPos(s.furthest < 0 ? 0 : s.furthest);
const keyFor = s => s.teacher + "|" + s.name.toLowerCase();

function studentRow(s) {
  const key = keyFor(s);
  const pct = pctFor(s);
  const had = previousPositions.has(key);
  const startPct = had ? previousPositions.get(key) : 0;
  const moved = had ? startPct !== pct : pct > 0;
  const hatched = s.doneCount === STEPS.length;
  const skipped = STEPS.filter((st, i) => !s.done[st] && i < s.furthest);
  const nextStep = STEPS.find(st => !s.done[st]);
  const segW = stepPos(1);
  // Only show the next-step sign when every earlier step is finished (no skipped steps)
  const sign = s.furthest >= 0 && s.doneCount === s.furthest + 1 && NEXT_SIGNS[s.furthest]
    ? `<div class="sign" style="left:${stepPos(s.furthest) + segW / 2}% "><i>${NEXT_SIGNS[s.furthest].icon}</i>${NEXT_SIGNS[s.furthest].text}</div>`
    : "";
  const tip = hatched ? "Finished all five steps!"
    : skipped.length ? `Skipped: ${skipped.join(", ")}` : `${s.doneCount}/5 done · next: ${nextStep}`;
  return `
    <div class="stu${hatched ? " hatched" : ""}${skipped.length ? " flag" : ""}" title="${esc(s.name)} — ${tip}">
      <div class="name">${esc(s.name)}</div>
      <div class="track">
        <div class="rail"></div><div class="rail-end"></div>
        <div class="fill" data-to="${pct}" style="width:${startPct}%"></div>
        ${STEPS.map((st, i) => {
          const cls = s.done[st] ? " done" : (i < s.furthest ? " skipped" : "");
          return `<div class="nest${cls}" style="left:${stepPos(i)}%"><span>${i + 1}</span></div>`;
        }).join("")}
        ${sign}
        <div class="egg${moved ? " bounce" : ""}" data-to="${pct}" style="left:${startPct}%">${eggSvg(hatched)}</div>
      </div>
    </div>`;
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const list = allStudents.filter(s =>
    (!q || s.name.toLowerCase().includes(q)) && (!teacherEl.value || s.teacher === teacherEl.value));

  if (!allStudents.length) {
    board.style.columnCount = "";
    board.innerHTML = `<div class="msg"><h2>The nest is empty 🥚</h2>No form responses yet. Students will appear here as soon as they submit.</div>`;
    return;
  }
  if (!list.length) {
    board.style.columnCount = "";
    board.innerHTML = `<div class="msg">No students match that search.</div>`;
    return;
  }

  // Bundle students into their groups (separate bubbles per teacher if there are several)
  const multiTeacher = new Set(list.map(s => s.teacher)).size > 1;
  const groups = new Map();
  list.forEach(s => {
    const k = (multiTeacher ? s.teacher : "") + "|" + (s.group || "");
    if (!groups.has(k)) groups.set(k, { teacher: s.teacher, group: s.group, kids: [] });
    groups.get(k).kids.push(s);
  });
  const ordered = [...groups.values()].sort((a, b) =>
    a.teacher.localeCompare(b.teacher) ||
    ((parseFloat(a.group) || 9999) - (parseFloat(b.group) || 9999)) ||
    a.group.localeCompare(b.group));

  board.innerHTML = ordered.map((g, idx) => {
    g.kids.sort((a, b) => a.name.localeCompare(b.name));
    const allDone = g.kids.every(k => k.doneCount === STEPS.length);
    const title = g.group ? `Group ${esc(g.group)}` : "No group yet";
    return `
      <section class="group${allDone ? " all-hatched" : ""}" style="animation-delay:${Math.min(idx * 40, 500)}ms">
        <div class="ghead">
          <b>${title}${multiTeacher && g.teacher ? `<small>${esc(g.teacher)}</small>` : ""}</b>
          <div class="labels">${STEPS.map((st, i) => `<span style="left:${stepPos(i)}%">${st}</span>`).join("")}</div>
        </div>
        ${g.kids.map(studentRow).join("")}
      </section>`;
  }).join("");

  fitToScreen();

  requestAnimationFrame(() => requestAnimationFrame(() => {
    board.querySelectorAll(".egg").forEach(el => { el.style.left = el.dataset.to + "%"; });
    board.querySelectorAll(".fill").forEach(el => { el.style.width = el.dataset.to + "%"; });
  }));
  list.forEach(s => previousPositions.set(keyFor(s), pctFor(s)));
}

/* =========================================================
   Fit the whole class on one screen: try 1–4 columns and pick the
   layout that lets everything be as large as possible without scrolling.
   (Phones just scroll in a single column.)
   ========================================================= */
const MIN_COL_EM = 27;   // narrowest a column may get, in board-em
function fitToScreen() {
  if (!board.querySelector(".group")) return;
  if (window.innerWidth < 700) { board.style.columnCount = 1; board.style.fontSize = "16px"; return; }
  const avail = window.innerHeight - board.getBoundingClientRect().top - 16;
  const width = board.clientWidth;
  const fits = (cols, size) => {
    board.style.columnCount = cols;
    board.style.fontSize = size + "px";
    const colWidth = (width - (cols - 1) * 0.8 * size) / cols;
    return colWidth >= MIN_COL_EM * size && board.scrollHeight <= avail;
  };
  let best = { cols: 1, size: 9 };
  for (let cols = 1; cols <= 4; cols++) {
    let lo = 9, hi = 22;
    if (!fits(cols, lo)) continue;
    for (let n = 0; n < 12; n++) { const mid = (lo + hi) / 2; if (fits(cols, mid)) lo = mid; else hi = mid; }
    if (lo > best.size + 0.3) best = { cols, size: lo };
  }
  board.style.columnCount = best.cols;
  board.style.fontSize = Math.floor(best.size * 10) / 10 + "px";
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitToScreen, 120); });

async function refresh() {
  document.getElementById("updatedText").textContent = "Checking the nest…";
  try {
    const sheet = await loadSheet();
    allStudents = buildStudents(sheet);
    fillFilters();
    render();
    document.getElementById("updatedText").textContent =
      "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (err) {
    console.error(err);
    document.getElementById("updatedText").textContent = "Couldn't reach the sheet";
    if (!allStudents.length) {
      board.innerHTML = `<div class="msg"><h2>Uh-oh, a cracked connection 🥚</h2>
        The board couldn't read the Google Sheet. Make sure it's shared as
        <code>Anyone with the link → Viewer</code> and the tab is named <code>${esc(SHEET_TAB)}</code>.</div>`;
    }
  }
}

[searchEl, teacherEl].forEach(el => el.addEventListener("input", () => { previousPositions.clear(); render(); }));
document.getElementById("refreshBtn").addEventListener("click", refresh);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitToScreen);
refresh();
setInterval(refresh, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
