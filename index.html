<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom Timer Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background-color: #f4f5f7; }

    /* Modal Overlay for Mode Selection and Roster Selection */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-card {
      background: #fff; padding: 24px; border-radius: 16px; width: 80%; max-width: 600px;
      max-height: 85vh; overflow-y: auto; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-title { font-size: 1.5rem; margin-bottom: 20px; color: #333; }
    .modal-note { font-size: 0.95rem; color: #6b7280; margin-top: 16px; }
    .btn-group { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .modal-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }

    .btn-choice {
      padding: 16px 24px; font-size: 1.2rem; font-weight: bold; border-radius: 10px;
      border: none; cursor: pointer; color: white; background: #4f46e5; transition: transform 0.1s;
    }
    .btn-choice:active { transform: scale(0.96); }
    .btn-secondary {
      padding: 12px 24px; font-size: 1.05rem; font-weight: bold; border-radius: 10px;
      border: 1px solid #d1d5db; background: #f3f4f6; color: #374151; cursor: pointer;
    }
    .btn-secondary:active { transform: scale(0.96); }

    .roster-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 50vh; overflow-y: auto; margin-top: 15px; width: 100%; }
    .roster-btn { padding: 12px; font-size: 1rem; border: 1px solid #ccc; background: #f9fafb; border-radius: 8px; cursor: pointer; text-align: left; }
    .roster-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Main Dashboard Layout (iPad Landscape Optimized) */
    .dashboard { display: flex; width: 100vw; height: 100vh; padding: 12px; gap: 12px; }
    .left-section { width: 75vw; height: 100%; display: flex; flex-direction: column; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .right-section { width: 25vw; height: 100%; display: flex; flex-direction: column; gap: 12px; }

    .section-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; text-align: center; color: #1f2937; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Hallway Checkout Grid */
    .grid-4x3 { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; flex: 1; }
    .hallway-btn {
      background-color: #d8b4fe; border: none; border-radius: 12px; font-size: 2.2rem; font-weight: bold;
      color: #3b0764; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.2s;
    }
    .hallway-btn.active-timer { background-color: #ef4444; color: #fff; }
    .hallway-btn.expired-timer { animation: overdue-flash 1s steps(1, end) infinite; }
    @keyframes overdue-flash {
      0%   { background-color: #facc15; color: #422006; }
      50%  { background-color: #ea580c; color: #fff; }
    }
    .timer-subtext { font-size: 1.2rem; margin-top: 4px; }

    /* Top-Right: Challenge Window */
    .testing-container { flex: 0 0 30%; background: #fff; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .status-square {
      flex: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: bold; color: white; text-align: center; padding: 8px;
    }
    .status-open { background-color: #22c55e; }
    .status-closed { background-color: #ef4444; }

    /* Bottom-Right: Bathroom */
    .bathroom-container { flex: 1; min-height: 0; background: #fff; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .bathroom-btn {
      flex: 1; border: none; border-radius: 12px; font-size: 1.3rem; font-weight: bold; color: white;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center;
    }
    .btn-girls { background-color: #22c55e; }
    .btn-boys { background-color: #3b82f6; }
    .bathroom-btn.active-checkout { background-color: #ef4444; }
    .bathroom-time { font-size: 1rem; margin-top: 4px; }

    /* Manual export */
    .export-btn {
      flex: 0 0 48px; border: none; border-radius: 12px; background: #374151; color: #fff;
      font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    .export-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div id="mode-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 class="modal-title">Select Day Schedule Mode</h2>
      <div class="btn-group">
        <button class="btn-choice" onclick="selectMode('normal')">Normal Day</button>
        <button class="btn-choice" onclick="selectMode('early')" style="background-color: #f59e0b;">Early Dismissal</button>
      </div>
      <p id="mode-note" class="modal-note" style="display: none;"></p>
    </div>
  </div>

  <div id="roster-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h2 id="roster-title" class="modal-title">Select Teacher</h2>
      <div id="roster-content" class="btn-group"></div>
      <div id="roster-actions" class="modal-actions"></div>
    </div>
  </div>

  <div class="dashboard">
    <div class="left-section">
      <div class="section-title">Hallway Checkout</div>
      <div class="grid-4x3" id="hallway-grid"></div>
    </div>

    <div class="right-section">
      <div class="testing-container">
        <div class="section-title">Challenge Window</div>
        <div id="testing-status" class="status-square status-closed">Challenge Window Closed</div>
      </div>

      <div class="bathroom-container">
        <div class="section-title">Bathroom</div>
        <button id="btn-girls" class="bathroom-btn btn-girls" onclick="initiateBathroomCheckout('Girls')">
          <span>Girls</span>
        </button>
        <button id="btn-boys" class="bathroom-btn btn-boys" onclick="initiateBathroomCheckout('Boys')">
          <span>Boys</span>
        </button>
      </div>

      <button class="export-btn" onclick="generatePDF()">Export Log (PDF)</button>
    </div>
  </div>

  <script>
    // ---------- Settings ----------
    const TZ = 'America/Chicago';
    const STORAGE_KEY = 'classroomDashboard_v2';
    const HALLWAY_SECONDS = 300;      // 5-minute hallway timer
    const OVERDUE_REPEAT_SEC = 60;    // repeat the "not checked back in" announcement this often
    const AUDIO_GRACE_MIN = 2;        // play a song up to 2 min late if the iPad was asleep at the exact minute
    const PDF_GRACE_MIN = 60;         // auto-export up to 60 min late if the iPad was asleep at the exact minute

    // Google Sheet logging: paste the Apps Script web app URL (ends in /exec) between the quotes.
    // Leave blank to turn sheet logging off.
    const SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzQLPzyip_eZx6FHuGNV4hi91XSm0eK6oEibiJwgwenL4G4mEWwQXc64UcKLXoMOTk/exec';
    const SHEET_QUEUE_KEY = 'classroomDashboard_sheetQueue';

    // Audio files must be in the same folder as this HTML file
    const miserlouAudio = new Audio('miserlou.mp3');
    const rumbleAudio = new Audio('rumble.mp3');

    // Times are 24-hour "HH:MM" Chicago time; challenge windows are [startMinute, endMinute)
    const SCHEDULES = {
      normal: {
        challenge: [['08:15', '08:40'], ['09:45', '10:10'], ['10:25', '10:50']],
        miserlou: ['08:43', '10:13', '10:54'],
        rumble: ['12:18', '13:23', '14:23'],
        pdf: '14:30'
      },
      early: {
        challenge: [['08:15', '08:30'], ['09:25', '09:40'], ['09:55', '10:10']],
        miserlou: ['08:33', '09:43', '10:13'],
        rumble: ['11:23', '12:03', '12:53'],
        pdf: '13:30'
      }
    };

    // Rosters Data
    const rosters = {
      Tyrakowski: ["Mason Michael Bishop","Aidan Diaz","Mia Yesugen Dovchinsuren","Sindhu Dumbala","Emma Eve Grasyuk","Evelyn Ignatyev","Armaan Khan","Vidhun Kishorekumar","Moksha Reddy Maddike","Mason Elaine Michelson","Ajith Karthikeya Nidumolu","Sophia Anastasia Nitkiewicz","Vansh Pandey","Krish Gaurang Patel","Arnavi Vinay Rao","Saathvik Satish","Mihir Saxena","Jeremy Jiwoo Shin","Nikhilesh Shivananda","Sofia Aracely Staski","Tanmay Teotia","Swara Nimitt Thakore","Heaven Williams"],
      Friedman: ["Joi Badia","Brodi Luan Caushi","Timothy Stephen Chen","Kennedy Elizabeth Connors","Sniksha Edem","Kabir Gaba","Shivali Gorai","Emmett Daniel Jamerson","Walter Lawrence Kansler","Vidita Prafulla Khasbag","Jayden Jing Ren Khor","Vidhula Mahesh","Vikram Harish Nair","Ansh K Nirmal","Iker Olvera","Richard Krishna Potula","Natalie Elaine Raff","Shrutika Rawat","Merushi Shah","Levi Joshua Stettner","Selma Toplic","Aahan Yadav"],
      Josefowicz: ["Sai Rishith Abbagani","Shanaya Agarwal","Kayleigh Sieun Ahn","Aarna Mythily Amarnath","Yuvika Bijwe","Brady Kevin Connors","Advik Dhane","Isabella Gjorgjiev","Jaxon Griffel","Pranav Jagadeshkumar","Abida Lyksykov","Alexis Marie Mescher","Adriana Dinkov Mihaylov","Enguuntugs Munkhzorig","Ariunsanaa Odkhuu","Aubrey Marie Plontke","Caleb Qi","Mishika Rawat","Benjamin Ari Richter","Vivaan Tandon","Vian Vijayababu"]
    };

    // ---------- Time helpers ----------
    function chicagoParts(d = new Date()) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: TZ, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }).formatToParts(d);
      const get = type => parts.find(p => p.type === type).value;
      let hrs = parseInt(get('hour'), 10);
      if (hrs === 24) hrs = 0; // some browsers report midnight as 24
      return {
        dateKey: `${get('year')}-${get('month')}-${get('day')}`,
        hrs,
        mins: parseInt(get('minute'), 10)
      };
    }
    function currentMinutesNow() {
      const p = chicagoParts();
      return p.hrs * 60 + p.mins;
    }
    function toMin(hhmm) {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }
    function fmtClock(ts) {
      return new Date(ts).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
    }
    function fmtDuration(totalSeconds) {
      totalSeconds = Math.max(0, Math.floor(totalSeconds));
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- Saved state (survives a refresh; resets each new day) ----------
    function freshState(dateKey) {
      return {
        dateKey,
        mode: null,
        log: [],                                   // { name, teacher, gender, out, back }
        played: {},                                // which songs / PDF already fired today
        bathroom: { Girls: null, Boys: null },     // { name, start, logIndex }
        hallway: Array(12).fill(null).map(() => ({ endAt: null, expired: false }))
      };
    }
    function loadState() {
      const today = chicagoParts().dateKey;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved && saved.dateKey === today) return saved;
        }
      } catch (e) { /* storage unavailable; start fresh */ }
      return freshState(today);
    }
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    }

    let state = loadState();
    let currentGenderCheckout = null;

    // ---------- Build Hallway Grid ----------
    const hallwayGrid = document.getElementById('hallway-grid');
    for (let i = 1; i <= 12; i++) {
      const btn = document.createElement('button');
      btn.className = 'hallway-btn';
      btn.id = `hallway-btn-${i}`;
      btn.onclick = () => handleHallwayClick(i - 1);
      btn.innerHTML = `<span>${i}</span><span class="timer-subtext" id="hallway-timer-${i}"></span>`;
      hallwayGrid.appendChild(btn);
    }

    // ---------- Mode selection ----------
    function showModeModal() {
      const note = document.getElementById('mode-note');
      if (state.log.length > 0) {
        note.textContent = `Restored ${state.log.length} bathroom checkout${state.log.length === 1 ? '' : 's'} from earlier today.`;
        note.style.display = 'block';
      } else {
        note.style.display = 'none';
      }
      document.getElementById('mode-modal').style.display = 'flex';
    }

    function selectMode(mode) {
      state.mode = mode;

      // Don't blast a song that was scheduled before the mode was picked
      const cur = currentMinutesNow();
      const sched = SCHEDULES[mode];
      ['miserlou', 'rumble'].forEach(k => {
        sched[k].forEach(t => {
          if (toMin(t) < cur) state.played[`${mode}_${k}_${t}`] = true;
        });
      });
      saveState();

      document.getElementById('mode-modal').style.display = 'none';

      // Unlock audio for Safari/iOS (muted so nothing is heard)
      [miserlouAudio, rumbleAudio].forEach(a => {
        a.muted = true;
        a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; })
                .catch(() => { a.muted = false; });
      });

      // Unlock speech for Safari/iOS
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0;
        window.speechSynthesis.speak(u);
      }

      tick();
    }

    // ---------- Hallway Logic ----------
    function handleHallwayClick(idx) {
      const h = state.hallway[idx];
      if (h.expired || h.endAt) {
        // Cancel a running timer, or reset an expired one back to purple
        h.endAt = null;
        h.expired = false;
        h.lastAnnounced = null;
      } else {
        // Start 5 min countdown (stored as an end time so it stays accurate if the iPad sleeps)
        h.endAt = Date.now() + HALLWAY_SECONDS * 1000;
      }
      saveState();
      updateHallway(Date.now());
    }

    function updateHallway(now) {
      state.hallway.forEach((h, idx) => {
        const btn = document.getElementById(`hallway-btn-${idx + 1}`);
        const label = document.getElementById(`hallway-timer-${idx + 1}`);

        if (h.endAt && !h.expired) {
          const left = Math.ceil((h.endAt - now) / 1000);
          if (left > 0) {
            btn.className = 'hallway-btn active-timer';
            label.textContent = fmtDuration(left);
            return;
          }
          h.expired = true;
          saveState();
        }

        if (h.expired) {
          // Overdue: flash, show how long past 5 minutes, and announce every minute until tapped
          if (btn.className !== 'hallway-btn expired-timer') btn.className = 'hallway-btn expired-timer';
          label.textContent = `+${fmtDuration((now - h.endAt) / 1000)}`;
          if (!h.lastAnnounced || now - h.lastAnnounced >= OVERDUE_REPEAT_SEC * 1000) {
            h.lastAnnounced = now;
            saveState();
            announceGroup(idx + 1);
          }
        } else {
          btn.className = 'hallway-btn';
          label.textContent = '';
        }
      });
    }

    function announceGroup(groupNum) {
      if ('speechSynthesis' in window) {
        const text = `Group ${groupNum}, Group ${groupNum}. Group ${groupNum} has not checked back in.`;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }
    }

    // ---------- Bathroom Logic ----------
    function initiateBathroomCheckout(gender) {
      const b = state.bathroom[gender];
      if (b) {
        // Student is back: record return time
        const entry = state.log[b.logIndex];
        if (entry && !entry.back) {
          entry.back = Date.now();
          sendToSheet({
            action: 'in',
            date: sheetDate(entry.out),
            name: entry.name,
            teacher: entry.teacher || '',
            timeOut: fmtClock(entry.out),
            timeIn: fmtClock(entry.back),
            timeGone: fmtDuration((entry.back - entry.out) / 1000)
          });
        }
        state.bathroom[gender] = null;
        saveState();
        updateBathroom(Date.now());
      } else {
        currentGenderCheckout = gender;
        openTeacherModal();
      }
    }

    function closeRosterModal() {
      document.getElementById('roster-modal').style.display = 'none';
      currentGenderCheckout = null;
    }

    function makeButton(className, text, onClick) {
      const btn = document.createElement('button');
      btn.className = className;
      btn.textContent = text;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function openTeacherModal() {
      const modal = document.getElementById('roster-modal');
      const content = document.getElementById('roster-content');
      const actions = document.getElementById('roster-actions');
      document.getElementById('roster-title').textContent = `Select Teacher (${currentGenderCheckout})`;

      content.innerHTML = '';
      ['Josefowicz', 'Friedman', 'Tyrakowski'].forEach(teacher => {
        content.appendChild(makeButton('btn-choice', teacher, () => openStudentModal(teacher)));
      });

      actions.innerHTML = '';
      actions.appendChild(makeButton('btn-secondary', 'Cancel', closeRosterModal));

      modal.style.display = 'flex';
    }

    function openStudentModal(teacher) {
      const content = document.getElementById('roster-content');
      const actions = document.getElementById('roster-actions');
      document.getElementById('roster-title').textContent = `Select Student (${teacher})`;

      // Names already out in the other bathroom can't be checked out twice
      const outNow = Object.values(state.bathroom).filter(Boolean).map(b => b.name);

      const list = document.createElement('div');
      list.className = 'roster-list';
      rosters[teacher].forEach(name => {
        const btn = makeButton('roster-btn', name, () => selectStudent(name, teacher));
        if (outNow.includes(name)) btn.disabled = true;
        list.appendChild(btn);
      });
      content.innerHTML = '';
      content.appendChild(list);

      actions.innerHTML = '';
      actions.appendChild(makeButton('btn-secondary', 'Back', openTeacherModal));
      actions.appendChild(makeButton('btn-secondary', 'Cancel', closeRosterModal));
    }

    function selectStudent(studentName, teacher) {
      const gender = currentGenderCheckout;
      closeRosterModal();
      if (!gender || state.bathroom[gender]) return;

      const now = Date.now();
      state.log.push({ name: studentName, teacher, gender, out: now, back: null });
      state.bathroom[gender] = { name: studentName, start: now, logIndex: state.log.length - 1 };
      saveState();
      updateBathroom(now);

      sendToSheet({
        action: 'out',
        date: sheetDate(now),
        name: studentName,
        teacher,
        timeOut: fmtClock(now)
      });
    }

    // ---------- Google Sheet logging ----------
    // Each checkout/return is queued and sent in order. If the Wi-Fi drops,
    // the queue is saved on the iPad and retried until it goes through.
    function sheetDate(ts) {
      return new Date(ts).toLocaleDateString('en-US', { timeZone: TZ });
    }
    function loadSheetQueue() {
      try { return JSON.parse(localStorage.getItem(SHEET_QUEUE_KEY)) || []; } catch (e) { return []; }
    }
    function saveSheetQueue() {
      try { localStorage.setItem(SHEET_QUEUE_KEY, JSON.stringify(sheetQueue)); } catch (e) { /* ignore */ }
    }

    let sheetQueue = loadSheetQueue();
    let sheetFlushing = false;

    function sendToSheet(payload) {
      if (!SHEET_WEBHOOK_URL) return;
      sheetQueue.push(payload);
      saveSheetQueue();
      flushSheetQueue();
    }

    async function flushSheetQueue() {
      if (sheetFlushing || !SHEET_WEBHOOK_URL || sheetQueue.length === 0) return;
      sheetFlushing = true;
      try {
        while (sheetQueue.length > 0) {
          await fetch(SHEET_WEBHOOK_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(sheetQueue[0])
          });
          sheetQueue.shift();
          saveSheetQueue();
        }
      } catch (e) {
        // Offline or Google unreachable: leave it queued and retry later
      } finally {
        sheetFlushing = false;
      }
    }

    function updateBathroom(now) {
      ['Girls', 'Boys'].forEach(gender => {
        const b = state.bathroom[gender];
        const btn = document.getElementById(`btn-${gender.toLowerCase()}`);
        if (b) {
          btn.className = 'bathroom-btn active-checkout';
          btn.innerHTML = `<span>${escapeHtml(b.name)}</span><span class="bathroom-time">${fmtDuration((now - b.start) / 1000)}</span>`;
        } else {
          btn.className = `bathroom-btn btn-${gender.toLowerCase()}`;
          btn.innerHTML = `<span>${gender}</span>`;
        }
      });
    }

    // Tapping the dark background closes the student/teacher picker
    document.getElementById('roster-modal').addEventListener('click', e => {
      if (e.target.id === 'roster-modal') closeRosterModal();
    });

    // ---------- Time-based Schedule System ----------
    function tick() {
      const now = Date.now();
      const p = chicagoParts();

      // New day: clear everything and ask for the mode again
      if (p.dateKey !== state.dateKey) {
        state = freshState(p.dateKey);
        saveState();
        closeRosterModal();
        updateHallway(now);
        updateBathroom(now);
        updateChallengeWindow(-1);
        showModeModal();
        return;
      }

      updateHallway(now);
      updateBathroom(now);

      if (!state.mode) return;
      const cur = p.hrs * 60 + p.mins;
      updateChallengeWindow(cur);
      checkAudioTriggers(cur);
      checkPdfTrigger(cur);
    }

    function updateChallengeWindow(cur) {
      const statusBox = document.getElementById('testing-status');
      const sched = SCHEDULES[state.mode];
      const isOpen = !!sched && sched.challenge.some(([start, end]) => cur >= toMin(start) && cur < toMin(end));

      statusBox.className = `status-square ${isOpen ? 'status-open' : 'status-closed'}`;
      statusBox.textContent = isOpen ? 'Challenge Window Open' : 'Challenge Window Closed';
    }

    function playAudio(audio) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function checkAudioTriggers(cur) {
      const sched = SCHEDULES[state.mode];
      [['miserlou', miserlouAudio], ['rumble', rumbleAudio]].forEach(([k, audio]) => {
        sched[k].forEach(t => {
          const key = `${state.mode}_${k}_${t}`;
          const m = toMin(t);
          if (!state.played[key] && cur >= m && cur < m + AUDIO_GRACE_MIN) {
            state.played[key] = true;
            saveState();
            playAudio(audio);
          }
        });
      });
    }

    function checkPdfTrigger(cur) {
      const m = toMin(SCHEDULES[state.mode].pdf);
      if (!state.played.pdf && cur >= m && cur < m + PDF_GRACE_MIN) {
        state.played.pdf = true;
        saveState();
        generatePDF();
      }
    }

    // ---------- PDF Export ----------
    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const now = Date.now();

      doc.setFontSize(16);
      doc.text("Classroom Bathroom Checkout Log", 15, 20);
      doc.setFontSize(12);
      doc.text(`Date: ${state.dateKey}`, 15, 30);
      doc.text(`Schedule Mode: ${state.mode ? state.mode.toUpperCase() + ' DAY' : 'NOT SET'}`, 15, 38);
      doc.text(`Total checkouts: ${state.log.length}`, 15, 46);

      const cols = { out: 15, back: 42, dur: 69, name: 92, gender: 178 };
      let y = 58;

      const drawHeader = () => {
        doc.setFont(undefined, 'bold');
        doc.text("Out", cols.out, y);
        doc.text("Back", cols.back, y);
        doc.text("Gone", cols.dur, y);
        doc.text("Student Name", cols.name, y);
        doc.text("Gender", cols.gender, y);
        doc.line(15, y + 2, 195, y + 2);
        doc.setFont(undefined, 'normal');
        y += 10;
      };
      drawHeader();

      if (state.log.length === 0) {
        doc.text("No checkouts recorded today.", cols.out, y);
      } else {
        state.log.forEach(item => {
          if (y > 275) { doc.addPage(); y = 20; drawHeader(); }
          const gone = item.back ? fmtDuration((item.back - item.out) / 1000) : `${fmtDuration((now - item.out) / 1000)}*`;
          doc.text(fmtClock(item.out), cols.out, y);
          doc.text(item.back ? fmtClock(item.back) : 'Still out', cols.back, y);
          doc.text(gone, cols.dur, y);
          doc.text(doc.splitTextToSize(item.name, 82)[0], cols.name, y);
          doc.text(item.gender, cols.gender, y);
          y += 8;
        });
        if (state.log.some(item => !item.back)) {
          y += 4;
          if (y > 285) { doc.addPage(); y = 20; }
          doc.setFontSize(10);
          doc.text("* Still out when this log was exported; time shown is up to export.", cols.out, y);
        }
      }

      doc.save(`checkout-log-${state.dateKey}.pdf`);
    }

    // ---------- Start ----------
    updateHallway(Date.now());
    updateBathroom(Date.now());
    showModeModal();
    setInterval(tick, 1000);
    // Catch up immediately when the iPad wakes or the tab comes back into view
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { tick(); flushSheetQueue(); }
    });

    // Retry any unsent sheet entries
    flushSheetQueue();
    setInterval(flushSheetQueue, 30000);
    window.addEventListener('online', flushSheetQueue);
  </script>
</body>
</html>
