<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egg Car Hatchery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     SETTINGS — change these if your sheet or tab name changes
     ========================================================= */
  :root {
    --shell: #fffaf0;
    --shell-2: #fff3dc;
    --yolk: #ffc93c;
    --yolk-deep: #f4a300;
    --straw: #e9c98b;
    --nest: #a8743f;
    --nest-dark: #6e4a26;
    --ink: #3b2a1a;
    --ink-soft: #7a634b;
    --done: #7cc576;
    --done-deep: #3f8f3a;
    --card: #ffffff;
    --line: #f0e2c6;
    --shadow: 0 6px 18px rgba(110, 74, 38, .12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #fff6e0 0, transparent 40%),
      radial-gradient(circle at 90% 10%, #fdeccc 0, transparent 35%),
      var(--shell);
    min-height: 100vh;
  }
  .wrap { max-width: 1150px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .logo { width: 70px; height: 84px; flex: none; animation: wobble 4s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wobble { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(-7deg); } 90% { transform: rotate(6deg); } 95% { transform: rotate(-3deg); } }
  h1 {
    font-family: "Baloo 2", cursive; font-weight: 800;
    font-size: clamp(1.8rem, 4.5vw, 2.8rem); line-height: 1; margin: 0;
    color: var(--nest-dark);
  }
  h1 span { color: var(--yolk-deep); }
  .subtitle { margin: 4px 0 0; color: var(--ink-soft); font-weight: 600; }
  .updated { margin-left: auto; text-align: right; font-size: .85rem; color: var(--ink-soft); }
  .updated button {
    margin-top: 6px; font: inherit; font-weight: 700; cursor: pointer;
    background: var(--yolk); color: var(--ink); border: none; border-radius: 999px;
    padding: 7px 16px; box-shadow: 0 3px 0 var(--yolk-deep);
  }
  .updated button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--yolk-deep); }

  /* ---------- Stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat {
    background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow);
    border: 2px solid var(--line);
  }
  .stat b { display: block; font-family: "Baloo 2", cursive; font-size: 1.7rem; line-height: 1.1; color: var(--nest-dark); }
  .stat small { color: var(--ink-soft); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: .72rem; }
  .stat.hatched { background: linear-gradient(135deg, #fff7d1, #ffe9a3); border-color: var(--yolk); }

  /* ---------- Controls ---------- */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .controls input, .controls select {
    font: inherit; font-weight: 600; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 14px;
    padding: 9px 14px; min-width: 0;
  }
  .controls input { flex: 1 1 220px; }
  .controls select { flex: 0 1 auto; }
  .controls input:focus, .controls select:focus { outline: none; border-color: var(--yolk); }

  /* ---------- Step legend (column headings) ---------- */
  .legend {
    display: grid; grid-template-columns: 210px 1fr; gap: 14px; align-items: end;
    padding: 0 18px 8px;
  }
  .legend .steps { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; }
  .legend .steps div { font-family: "Baloo 2", cursive; font-weight: 800; color: var(--nest); font-size: 1rem; letter-spacing: .05em; }
  .legend .steps div em { display: block; font-style: normal; font-family: "Nunito"; font-weight: 600; font-size: .7rem; color: var(--ink-soft); letter-spacing: 0; }

  /* ---------- Student rows ---------- */
  .board { display: flex; flex-direction: column; gap: 12px; }
  .row {
    display: grid; grid-template-columns: 210px 1fr; gap: 14px; align-items: center;
    background: var(--card); border-radius: 22px; padding: 14px 18px;
    box-shadow: var(--shadow); border: 2px solid var(--line);
    animation: pop .4s ease both;
  }
  .row.complete { background: linear-gradient(90deg, #fffbe8, #fff); border-color: var(--yolk); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .who b { display: block; font-family: "Baloo 2", cursive; font-size: 1.2rem; line-height: 1.15; overflow-wrap: anywhere; }
  .who span { font-size: .8rem; color: var(--ink-soft); font-weight: 600; }
  .who .pct { display: inline-block; margin-top: 4px; font-weight: 800; color: var(--nest-dark); background: var(--shell-2); border-radius: 999px; padding: 1px 9px; }
  .row.complete .who .pct { background: var(--yolk); }

  /* Track */
  .track { position: relative; height: 74px; margin: 0 4%; }
  .track .rail {
    position: absolute; left: 0; right: 0; top: 50%; height: 10px; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, var(--straw) 0 10px, #f3dcae 10px 18px);
    border-radius: 99px;
  }
  .track .fill {
    position: absolute; left: 0; top: 50%; height: 10px; transform: translateY(-50%);
    background: linear-gradient(90deg, var(--yolk), var(--yolk-deep));
    border-radius: 99px; transition: width 1s cubic-bezier(.5,1.6,.4,1);
  }
  .nest {
    position: absolute; top: 50%; width: 34px; height: 34px; transform: translate(-50%, -50%);
    border-radius: 50%; background: #fff; border: 3px solid var(--straw);
    display: grid; place-items: center; font-weight: 800; font-size: .8rem; color: var(--straw);
    transition: background .4s, border-color .4s;
  }
  .nest.done { background: var(--done); border-color: var(--done-deep); color: #fff; }
  .nest.done::after { content: "✓"; font-size: 1rem; color: #fff; }
  .nest.done span { display: none; }
  .nest.skipped { background: #e5484d; border-color: #b4232a; color: #fff; animation: pulse 1.6s ease-in-out infinite; }
  .nest.skipped::after { content: "!"; font-size: 1.1rem; font-weight: 900; }
  .nest.skipped span { display: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,72,77,.45); } 50% { box-shadow: 0 0 0 7px rgba(229,72,77,0); } }
  .who .pct.warn { background: #ffe1e1; color: #b4232a; }
  .egg {
    position: absolute; top: 50%; width: 46px; height: 58px; transform: translate(-50%, -78%);
    transition: left 1.1s cubic-bezier(.5,1.5,.45,1);
    filter: drop-shadow(0 4px 3px rgba(110,74,38,.25));
    z-index: 2; pointer-events: none;
  }
  .egg.bounce { animation: hop 1.1s ease; }
  @keyframes hop { 0% { margin-top: 0; } 35% { margin-top: -18px; } 60% { margin-top: 0; } 75% { margin-top: -6px; } 100% { margin-top: 0; } }

  /* Messages */
  .msg {
    background: var(--card); border: 2px dashed var(--straw); border-radius: 22px;
    padding: 28px 22px; text-align: center; color: var(--ink-soft); font-weight: 600;
  }
  .msg h2 { font-family: "Baloo 2", cursive; color: var(--nest-dark); margin: 0 0 6px; }
  .msg code { background: var(--shell-2); padding: 2px 6px; border-radius: 6px; }

  footer { margin-top: 28px; text-align: center; color: var(--ink-soft); font-size: .8rem; }

  /* ---------- Phone layout ---------- */
  @media (max-width: 700px) {
    .legend { display: none; }
    .nest::before {
      content: attr(data-step); position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      margin-top: 4px; font-family: "Baloo 2", cursive; font-weight: 700; font-size: .62rem;
      letter-spacing: .03em; color: var(--nest);
    }
    .row { grid-template-columns: 1fr; gap: 6px; padding: 12px 12px 6px; }
    .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .who b { display: inline; }
    .track { margin: 0 9%; height: 70px; margin-bottom: 12px; }
    .nest { width: 28px; height: 28px; }
    .egg { width: 38px; height: 48px; }
    .updated { margin-left: 0; text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 70 84" aria-hidden="true">
      <ellipse cx="35" cy="78" rx="26" ry="5" fill="#e9c98b"/>
      <path d="M35 4C19 4 7 30 7 50c0 17 12 28 28 28s28-11 28-28C63 30 51 4 35 4z" fill="#fff" stroke="#e9c98b" stroke-width="3"/>
      <circle cx="26" cy="46" r="3.2" fill="#3b2a1a"/><circle cx="44" cy="46" r="3.2" fill="#3b2a1a"/>
      <path d="M29 56q6 5 12 0" stroke="#3b2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="54" r="3.5" fill="#ffb3a7" opacity=".7"/><circle cx="50" cy="54" r="3.5" fill="#ffb3a7" opacity=".7"/>
    </svg>
    <div>
      <h1>Egg Car <span>Hatchery</span></h1>
      <p class="subtitle">Watch every egg roll through the design process — and hatch at the end!</p>
    </div>
    <div class="updated">
      <div id="updatedText">Loading…</div>
      <button id="refreshBtn" type="button">↻ Refresh</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Class summary"></section>

  <section class="controls">
    <input id="search" type="search" placeholder="🔍 Find a student…" aria-label="Search students">
    <select id="teacherFilter" aria-label="Filter by teacher"><option value="">All teachers</option></select>
    <select id="groupFilter" aria-label="Filter by group"><option value="">All groups</option></select>
    <select id="sortBy" aria-label="Sort">
      <option value="name">Sort: Name A–Z</option>
      <option value="progress">Sort: Most progress</option>
      <option value="least">Sort: Needs a nudge</option>
      <option value="group">Sort: Group</option>
    </select>
  </section>

  <div class="legend" aria-hidden="true">
    <div></div>
    <div class="steps">
      <div>ASK<em>Slide finished</em></div>
      <div>EXPLORE<em>Design approved</em></div>
      <div>MODEL<em>Car photo</em></div>
      <div>EVALUATE<em>Crash video</em></div>
      <div>EXPLAIN<em>Test described</em></div>
    </div>
  </div>

  <main class="board" id="board"><div class="msg">Gathering the eggs…</div></main>

  <footer>Updates automatically every minute from the class Google Sheet.</footer>
</div>

<script>
/* =========================================================
   SETTINGS
   ========================================================= */
const SHEET_ID   = "1kPS2ggL5fbPn51m6TvhCfranGeJ9z_0xDW5pOVneqvI";
const SHEET_TAB  = "Form Responses 1";   // tab name at the bottom of the sheet
const REFRESH_SECONDS = 60;               // how often the board reloads

/* The five steps, matched to the sheet by the capitalised word in each column header. */
const STEPS = ["ASK", "EXPLORE", "MODEL", "EVALUATE", "EXPLAIN"];

/* =========================================================
   Data loading (Google Visualization endpoint — no API key needed;
   the sheet just has to be shared as "Anyone with the link can view")
   ========================================================= */
const baseUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?headers=1&sheet=${encodeURIComponent(SHEET_TAB)}`;

function parseGviz(text) {
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  return JSON.parse(text.slice(start, end + 1));
}

async function loadViaFetch() {
  const res = await fetch(baseUrl + "&tqx=out:json&_=" + Date.now());
  if (!res.ok) throw new Error("HTTP " + res.status);
  return parseGviz(await res.text());
}

function loadViaJsonp() {
  return new Promise((resolve, reject) => {
    const cb = "eggCb" + Date.now();
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("script error")); };
    s.src = baseUrl + "&tqx=responseHandler:" + cb + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

async function loadSheet() {
  let data;
  try { data = await loadViaFetch(); }
  catch (e) { data = await loadViaJsonp(); }
  if (data.status === "error") throw new Error((data.errors && data.errors[0] && data.errors[0].detailed_message) || "Sheet error");
  const headers = data.table.cols.map(c => (c.label || "").trim());
  const rows = data.table.rows.map(r => (r.c || []).map(cell => {
    if (!cell) return "";
    if (cell.f != null) return String(cell.f);
    return cell.v == null ? "" : String(cell.v);
  }));
  return { headers, rows };
}

/* =========================================================
   Turn form responses into one record per student.
   The form has repeated sections (one per teacher), each starting
   with a "Name" column, followed by group + the five step columns.
   A student's step counts as done if ANY of their rows says Yes.
   ========================================================= */
function buildStudents({ headers, rows }) {
  let teacherCol = -1, timeCol = -1;
  const sections = [];
  let current = null;

  headers.forEach((h, i) => {
    const lower = h.toLowerCase();
    if (lower === "name" || lower === "student name" || lower === "your name") {
      current = { name: i, group: -1, steps: {} };
      sections.push(current);
      return;
    }
    if (!current) {
      if (lower.includes("teacher")) teacherCol = i;
      if (lower.includes("timestamp")) timeCol = i;
      return;
    }
    if (lower.includes("group")) { current.group = i; return; }
    STEPS.forEach(step => {
      if (new RegExp("\\b" + step + "\\b").test(h) && current.steps[step] == null) current.steps[step] = i;
    });
  });

  const isYes = v => /^\s*(y|yes|true|done|x|✓)\s*$/i.test(v || "");
  const students = new Map();

  rows.forEach(row => {
    const teacher = teacherCol >= 0 ? (row[teacherCol] || "").trim() : "";
    const time = timeCol >= 0 ? row[timeCol] : "";
    sections.forEach(sec => {
      const rawName = (row[sec.name] || "").trim().replace(/\s+/g, " ");
      if (!rawName) return;
      const key = teacher.toLowerCase() + "|" + rawName.toLowerCase();
      if (!students.has(key)) {
        students.set(key, { name: rawName, teacher, group: "", done: {}, last: "" });
      }
      const s = students.get(key);
      const grp = sec.group >= 0 ? (row[sec.group] || "").trim() : "";
      if (grp) s.group = grp.replace(/\.0$/, "");
      STEPS.forEach(step => {
        const col = sec.steps[step];
        if (col != null && isYes(row[col])) s.done[step] = true;
      });
      if (time) s.last = time;
    });
  });

  return [...students.values()].map(s => {
    const doneCount = STEPS.filter(st => s.done[st]).length;
    let furthest = -1;
    STEPS.forEach((st, i) => { if (s.done[st]) furthest = i; });
    return { ...s, doneCount, furthest };
  });
}

/* =========================================================
   Rendering
   ========================================================= */
const board = document.getElementById("board");
const statsEl = document.getElementById("stats");
const searchEl = document.getElementById("search");
const teacherEl = document.getElementById("teacherFilter");
const groupEl = document.getElementById("groupFilter");
const sortEl = document.getElementById("sortBy");
let allStudents = [];
let previousPositions = new Map();

function eggSvg(hatched) {
  if (hatched) {
    // Hatched chick in a cracked shell
    return `<svg viewBox="0 0 46 58" aria-hidden="true">
      <circle cx="23" cy="24" r="14" fill="#ffd84a" stroke="#f4a300" stroke-width="2"/>
      <path d="M19 9q4-6 6 0" stroke="#f4a300" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="18" cy="22" r="2.4" fill="#3b2a1a"/><circle cx="28" cy="22" r="2.4" fill="#3b2a1a"/>
      <path d="M21 27l2 3 2-3z" fill="#f47c20"/>
      <path d="M5 34l6 4 6-5 6 5 6-5 6 5 6-4c0 12-8 21-18 21S5 46 5 34z" fill="#fff" stroke="#e9c98b" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 46 58" aria-hidden="true">
    <path d="M23 3C12 3 4 21 4 35c0 12 8 20 19 20s19-8 19-20C42 21 34 3 23 3z" fill="#fff" stroke="#e9c98b" stroke-width="2.5"/>
    <ellipse cx="15" cy="20" rx="3" ry="6" fill="#fff6e0" transform="rotate(20 15 20)"/>
    <circle cx="17" cy="32" r="2.4" fill="#3b2a1a"/><circle cx="29" cy="32" r="2.4" fill="#3b2a1a"/>
    <path d="M19 39q4 3.5 8 0" stroke="#3b2a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderStats(list) {
  const total = list.length;
  const counts = STEPS.map(st => list.filter(s => s.done[st]).length);
  const hatched = list.filter(s => s.doneCount === STEPS.length).length;
  statsEl.innerHTML =
    `<div class="stat"><b>${total}</b><small>Eggs in the nest</small></div>` +
    STEPS.map((st, i) => `<div class="stat"><b>${counts[i]}</b><small>${st} done</small></div>`).join("") +
    `<div class="stat"><b style="color:#b4232a">❗ ${list.filter(s => STEPS.some((st, i) => !s.done[st] && i < s.furthest)).length}</b><small>Skipped a step</small></div>` +
    `<div class="stat hatched"><b>🐣 ${hatched}</b><small>Fully hatched</small></div>`;
}

function fillFilters() {
  const keepT = teacherEl.value, keepG = groupEl.value;
  const teachers = [...new Set(allStudents.map(s => s.teacher).filter(Boolean))].sort();
  const groups = [...new Set(allStudents.map(s => s.group).filter(Boolean))]
    .sort((a, b) => (parseFloat(a) - parseFloat(b)) || a.localeCompare(b));
  teacherEl.innerHTML = `<option value="">All teachers</option>` + teachers.map(t => `<option>${esc(t)}</option>`).join("");
  groupEl.innerHTML = `<option value="">All groups</option>` + groups.map(g => `<option value="${esc(g)}">Group ${esc(g)}</option>`).join("");
  if (teachers.includes(keepT)) teacherEl.value = keepT;
  if (groups.includes(keepG)) groupEl.value = keepG;
  teacherEl.style.display = teachers.length > 1 ? "" : "none";
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  let list = allStudents.filter(s =>
    (!q || s.name.toLowerCase().includes(q)) &&
    (!teacherEl.value || s.teacher === teacherEl.value) &&
    (!groupEl.value || s.group === groupEl.value)
  );

  const byName = (a, b) => a.name.localeCompare(b.name);
  const sorters = {
    name: byName,
    progress: (a, b) => (b.furthest - a.furthest) || (b.doneCount - a.doneCount) || byName(a, b),
    least: (a, b) => (a.furthest - b.furthest) || (a.doneCount - b.doneCount) || byName(a, b),
    group: (a, b) => ((parseFloat(a.group) || 999) - (parseFloat(b.group) || 999)) || byName(a, b),
  };
  list.sort(sorters[sortEl.value]);

  renderStats(list);

  if (!allStudents.length) {
    board.innerHTML = `<div class="msg"><h2>The nest is empty 🥚</h2>No form responses yet. Students will appear here as soon as they submit.</div>`;
    return;
  }
  if (!list.length) {
    board.innerHTML = `<div class="msg">No students match that search.</div>`;
    return;
  }

  board.innerHTML = list.map((s, idx) => {
    const key = s.teacher + "|" + s.name.toLowerCase();
    const pos = s.furthest < 0 ? 0 : s.furthest;
    const pct = (pos / (STEPS.length - 1)) * 100;
    const startPct = previousPositions.has(key) ? previousPositions.get(key) : 0;
    const moved = previousPositions.has(key) ? startPct !== pct : pct > 0;
    const hatched = s.doneCount === STEPS.length;
    const meta = [s.group && `Group ${esc(s.group)}`, s.teacher && esc(s.teacher)].filter(Boolean).join(" · ");
    const nextStep = STEPS.find(st => !s.done[st]);
    const skipped = STEPS.filter((st, i) => !s.done[st] && i < s.furthest);
    const label = hatched
      ? `${esc(s.name)} has finished all five steps`
      : `${esc(s.name)} has finished ${s.doneCount} of 5 steps; next up: ${nextStep}`;
    return `
      <article class="row${hatched ? " complete" : ""}" style="animation-delay:${Math.min(idx * 30, 600)}ms" aria-label="${label}">
        <div class="who">
          <b>${esc(s.name)}</b>
          <span>${meta}</span>
          ${skipped.length ? `<span class="pct warn">❗ Skipped: ${skipped.join(", ")}</span>` : `<span class="pct">${hatched ? "🐣 Hatched!" : `${s.doneCount}/5 · next: ${nextStep}`}</span>`}
        </div>
        <div class="track">
          <div class="rail"></div>
          <div class="fill" data-to="${pct}" style="width:${startPct}%"></div>
          ${STEPS.map((st, i) => `<div class="nest${s.done[st] ? " done" : (i < s.furthest ? " skipped" : "")}" data-step="${st}" style="left:${(i / (STEPS.length - 1)) * 100}%" title="${st}${s.done[st] ? " ✓" : (i < s.furthest ? " — skipped! Go back and finish this step" : "")}"><span>${i + 1}</span></div>`).join("")}
          <div class="egg${moved ? " bounce" : ""}" data-to="${pct}" data-key="${esc(key)}" style="left:${startPct}%">${eggSvg(hatched)}</div>
        </div>
      </article>`;
  }).join("");

  // Animate eggs from their old spot to the new one
  requestAnimationFrame(() => requestAnimationFrame(() => {
    board.querySelectorAll(".egg").forEach(el => { el.style.left = el.dataset.to + "%"; });
    board.querySelectorAll(".fill").forEach(el => { el.style.width = el.dataset.to + "%"; });
  }));
  list.forEach(s => {
    const pos = s.furthest < 0 ? 0 : s.furthest;
    previousPositions.set(s.teacher + "|" + s.name.toLowerCase(), (pos / (STEPS.length - 1)) * 100);
  });
}

async function refresh() {
  document.getElementById("updatedText").textContent = "Checking the nest…";
  try {
    const sheet = await loadSheet();
    allStudents = buildStudents(sheet);
    fillFilters();
    render();
    document.getElementById("updatedText").textContent =
      "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (err) {
    console.error(err);
    document.getElementById("updatedText").textContent = "Couldn't reach the sheet";
    if (!allStudents.length) {
      board.innerHTML = `<div class="msg"><h2>Uh-oh, a cracked connection 🥚</h2>
        The board couldn't read the Google Sheet. Make sure it's shared as
        <code>Anyone with the link → Viewer</code> and the tab is named <code>${esc(SHEET_TAB)}</code>.</div>`;
    }
  }
}

[searchEl, teacherEl, groupEl, sortEl].forEach(el => el.addEventListener("input", () => { previousPositions.clear(); render(); }));
document.getElementById("refreshBtn").addEventListener("click", refresh);
refresh();
setInterval(refresh, REFRESH_SECONDS * 1000);
</script>
</body>
</html>
